<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Raydium-LP1</title>
  <meta name="description" content="Dry-run Raydium LP scanner project"/>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(800px 500px at 12% -8%,#1a2638,#0e1218 55%); color:#eaf0fa; font-family:system-ui,sans-serif; }
    .card { max-width:520px; padding:1.75rem; border-radius:14px; border:1px solid #293241; background:#171d27; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    .eyebrow { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:#93a4ba; margin:0 0 .35rem; }
    h1 { margin:.2rem 0 .75rem; font-size:1.35rem; }
    p { line-height:1.5; color:#c8d4e6; margin:.5rem 0; }
    .warning { color:#fdb34b; font-weight:600; }
    code { display:block; margin-top:1rem; font-size:.78rem; background:#212a3b; padding:.6rem .75rem; border-radius:8px; color:#9fd0ff; }
    nav { margin-top:1.25rem; font-size:.88rem; }
    nav a { color:#4596ff; margin-right:1rem; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Raydium-LP1</p>
    <h1>Extreme APR LP scanner</h1>
    <p>
      Scans Raydium pool data, applies safety filters, and surfaces candidates. Local UIs read
      <code style="display:inline;padding:.1rem .3rem">reports/dashboard.json</code> from the scanner.
    </p>
    <p class="warning">Dry-run only in this build: no signed swaps.</p>
    <nav>
      <a href="/">Funnel &amp; settings</a>
      <a href="/positions.html">Positions view</a>
    </nav>
    <code>.\scripts\start_stack.cmd</code>
  </main>
</body>
</html>
