<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Raydium-LP1</title>
  <meta name="description" content="Dry-run Raydium LP scanner project"/>
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#ffffff; color:#111827; font-family:system-ui,sans-serif; }
    .card { max-width:520px; padding:1.75rem; border-radius:14px; border:1px solid #d0d7e2; background:#f6f7f9; box-shadow:0 8px 28px rgba(0,0,0,.06); }
    .eyebrow { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:#5b6577; margin:0 0 .35rem; }
    h1 { margin:.2rem 0 .75rem; font-size:1.35rem; }
    p { line-height:1.5; color:#374151; margin:.5rem 0; }
    .warning { color:#b45309; font-weight:600; }
    code { display:block; margin-top:1rem; font-size:.78rem; background:#000; color:#e8eef8; padding:.6rem .75rem; border-radius:8px; border:1px solid #222; }
    nav { margin-top:1.25rem; font-size:.88rem; }
    nav a { color:#0b5fff; margin-right:1rem; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Raydium-LP1</p>
    <h1>Extreme APR LP scanner</h1>
    <p>
      Scans Raydium pool data, applies safety filters, and surfaces candidates. Local UIs read
      <code style="display:inline;padding:.1rem .35rem;font-size:.78rem;background:#111;color:#e8eef8;border-radius:6px;border:1px solid #333">reports/dashboard.json</code> from the scanner.
    </p>
    <p class="warning">Dry-run only in this build: no signed swaps.</p>
    <nav>
      <a href="/">Funnel &amp; settings</a>
      <a href="/positions.html">Positions view</a>
    </nav>
    <code>.\scripts\start_stack.cmd</code>
  </main>
</body>
</html>
